[project]
name = "video-object-tracking"
version = "0.1.0"
description = "Computer Vision Assignment: Object Detection, Instance Counting, and Lost Object Identification on Video"
authors = [{ name = "Jelita Rahma Ayu Guntari" }]
dependencies = [
    "opencv-python>=4.8.0",
    "ultralytics>=8.0.0",
    "lap>=0.5.12",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
]
readme = "README.md"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
